<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f97316"/>
    </marker>
    <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="24" fill="#0f172a"/>
  <text x="60" y="58" fill="#f8fafc" font-size="28" font-weight="700">What happens when you turn the key</text>

  <!-- lifelines -->
  <rect x="150" y="84" width="200" height="44" rx="12" fill="#1e293b" stroke="#f97316"/>
  <text x="250" y="112" fill="#f8fafc" font-size="17" font-weight="600" text-anchor="middle">iPhone · ScooterLink</text>
  <rect x="850" y="84" width="200" height="44" rx="12" fill="#1e293b" stroke="#38bdf8"/>
  <text x="950" y="112" fill="#f8fafc" font-size="17" font-weight="600" text-anchor="middle">PCX Bluetooth unit</text>
  <line x1="250" y1="128" x2="250" y2="610" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="950" y1="128" x2="950" y2="610" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>

  <g font-size="15">
    <!-- 1 -->
    <line x1="950" y1="165" x2="256" y2="165" stroke="#38bdf8" stroke-width="2" marker-end="url(#l)"/>
    <text x="600" y="157" fill="#e2e8f0" text-anchor="middle">ignition on → iOS completes the waiting connection, wakes the app</text>
    <!-- 2 -->
    <line x1="250" y1="215" x2="944" y2="215" stroke="#f97316" stroke-width="2" marker-end="url(#r)"/>
    <text x="600" y="207" fill="#e2e8f0" text-anchor="middle">first pairing only: send a fresh RSA-1024 public key</text>
    <line x1="950" y1="250" x2="256" y2="250" stroke="#38bdf8" stroke-width="2" marker-end="url(#l)"/>
    <text x="600" y="242" fill="#e2e8f0" text-anchor="middle">16-byte AES key, encrypted to that key (+ CRC-16), stored in the Keychain</text>
    <!-- 3 -->
    <line x1="250" y1="300" x2="944" y2="300" stroke="#f97316" stroke-width="2" marker-end="url(#r)"/>
    <text x="600" y="292" fill="#e2e8f0" text-anchor="middle">every ride: AES-encrypted "validation" message</text>
    <line x1="950" y1="335" x2="256" y2="335" stroke="#38bdf8" stroke-width="2" marker-end="url(#l)"/>
    <text x="600" y="327" fill="#e2e8f0" text-anchor="middle">OK + counter</text>
    <!-- 4 -->
    <line x1="250" y1="385" x2="944" y2="385" stroke="#f97316" stroke-width="2" marker-end="url(#r)"/>
    <text x="600" y="377" fill="#e2e8f0" text-anchor="middle">register button functions + colours (27 small writes, ~1 s)</text>
    <!-- 5 -->
    <line x1="250" y1="435" x2="944" y2="435" stroke="#f97316" stroke-width="2" marker-end="url(#r)"/>
    <text x="600" y="427" fill="#e2e8f0" text-anchor="middle">"please switch to the phone screen" (retried on the dash's 10 s ping)</text>
    <line x1="950" y1="470" x2="256" y2="470" stroke="#38bdf8" stroke-width="2" marker-end="url(#l)"/>
    <text x="600" y="462" fill="#e2e8f0" text-anchor="middle">mode = phone screen</text>
    <!-- 6 -->
    <line x1="950" y1="520" x2="256" y2="520" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#l)"/>
    <text x="600" y="512" fill="#f8fafc" font-weight="600" text-anchor="middle">button press: one byte  (01 prev · 02 next · 03 back · 04 select …)</text>
    <rect x="70" y="545" width="360" height="44" rx="12" fill="#1e293b" stroke="#f97316"/>
    <text x="250" y="573" fill="#fdba74" text-anchor="middle">→ play / pause / next / previous in iOS</text>
  </g>
</svg>
